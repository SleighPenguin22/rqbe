[package]
name = "rqbe"
version = "0.1.0"
edition = "2024"

[dependencies]
target-lexicon = { version = "0.13.5", features = ["std"] }
keyvec = {path="../keyvec"}
thiserror = "2.0.20"
strum = { version = "0.28.0", features = ["derive"] }
petgraph = { version = "0.8.3", features = ["rayon"] }
log = { version = "0.4.34", features = ["std"] }
simplelog = { version = "0.12.2", default-features = false }

[lib]
name = "librqbe"
path = "src/lib.rs"

[[bin]]
name = "rqbe"
path = "src/bin.rs"


[profile.release]
debug = true

[profile.optmax]
inherits = "release"
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
debug= true
