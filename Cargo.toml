[package]
name = "rqbe"
version = "0.1.0"
edition = "2024"

[dependencies]
bitvec = "1.1.1"
paste = "1.0.15"
target-lexicon = { version = "0.13.5", features = ["std"] }
idset = {path="../idset"}
thiserror = "2.0.20"
strum = { version = "0.28.0", features = ["derive"] }
petgraph = { version = "0.8.3", features = ["rayon"] }

[lib]
name = "librqbe"
path = "src/lib.rs"

[[bin]]
name = "rqbe"
path = "src/bin.rs"
